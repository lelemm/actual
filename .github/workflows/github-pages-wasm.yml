name: Publish WASM to GitHub Pages

on:
  push:
    branches: [feat/portable-bank-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lelemm/actual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("packages/bank-sync/Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build Pages bundle
        run: |
          yarn build:wasm
          cp packages/desktop-client/build/index.html packages/desktop-client/build/404.html
        env:
          PUBLIC_URL: /actual/
          REACT_APP_GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: packages/desktop-client/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
