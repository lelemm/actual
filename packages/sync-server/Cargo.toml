[package]
name = "actual-sync-server"
version = "26.8.0"
edition = "2024"
license = "MIT"
description = "Actual Budget sync server"

[lib]
path = "rust/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "actual-server"
path = "rust/main.rs"

[dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.23"
bcrypt = "0.19"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
percent-encoding = "2"
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["make"] }
tower-http = { version = "0.6", features = ["fs", "normalize-path", "set-header"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
